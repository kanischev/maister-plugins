schemaVersion: 1
name: pstack-refactor
metadata:
  title: "pstack — Refactor"
  summary: "Behavior-preserving structural change with a frozen baseline, constrained implementation, independent equivalence checks, and approval."
  labels: [refactor, behavior-preserving, maintenance]
  route_when: "Structure or representation must change while observable behavior stays fixed."
  links:
    - {
        kind: framework,
        title: "pstack refactoring playbook",
        url: "https://github.com/cursor/plugins/blob/main/pstack/skills/poteto-mode/playbooks/refactoring.md",
      }
runner_profiles:
  primary:
    capability_agent: claude
    effort: high
  independent:
    capability_agent: codex
    effort: high
compat:
  engine_min: 3.7.0
defaults:
  session_policy: resume
sessions:
  baseline: { runner: independent }
  implement: { runner: primary }
  verify: { runner: independent }
  finalize: { runner: primary }
nodes:
  - id: baseline
    type: ai_coding
    session: baseline
    action:
      prompt: |
        [MAIster x pstack execution contract]
        Work non-interactively. Do not ask questions, use Cursor Task
        subagents or /loop, consult global pstack model rules, create/switch
        worktrees or branches, push, merge, or open a PR.

        Establish the observable behavior that must remain unchanged for:
        {{ task.prompt }}

        Follow the pstack refactoring playbook with `how`, `why`, and
        `blast-radius`. Trace callers, data shapes, side effects, errors, and
        performance-sensitive behavior. Run existing tests and add only the
        smallest characterization test needed to freeze an otherwise unguarded
        contract. Do not perform the refactor in this node.
    output:
      produces:
        - { id: behavior-baseline, kind: test_report, current: true }
        - { id: refactor-map, kind: human_note, current: true }
    transitions:
      success: refactor

  - id: refactor
    type: ai_coding
    session: implement
    action:
      prompt: |
        Perform the smallest behavior-preserving refactor requested by
        {{ task.prompt }}. Use pstack `blast-radius`, `no-comments`, `unslop`,
        and applicable principle skills. Preserve the frozen contracts and keep
        representation changes explicit at every boundary. Do not add features,
        speculative abstractions, or unrelated cleanup. Do not commit or
        perform branch/PR operations.

        Rework feedback, if present: {{ review_comments }}
    input:
      requires:
        - { artifact: behavior-baseline, kind: test_report, inline: true }
        - { artifact: refactor-map, kind: human_note, inline: true }
    output:
      produces:
        - {
            id: impl-diff,
            kind: diff,
            current: true,
            requiredFor: [review, merge],
          }
    transitions:
      success: verify

  - id: verify
    type: judge
    session: verify
    action:
      prompt: |
        Independently test behavioral equivalence without editing code. Re-run
        the frozen baseline and relevant project checks, inspect affected
        callers and boundaries, and flag any feature change hidden as cleanup.
        End with one fenced `json maister:output` object:
        {
          "verdict": "pass" | "fail" | "blocked",
          "summary": "...",
          "commands": [],
          "evidence": {}
        }
    input:
      requires:
        - { artifact: behavior-baseline, kind: test_report, inline: true }
        - { artifact: impl-diff, kind: diff }
    output:
      result:
        schema: ./schemas/verification-result.v1.json
        required: true
        on_mismatch: retry
      produces:
        - { id: verification, kind: test_report, current: true }
    decide:
      from: output.verdict
    transitions:
      pass: approval
      fail: refactor
      blocked: approval
      exhausted: approval
    rework:
      allowedTargets: [refactor]
      workspacePolicies: [keep]
      maxLoops: 3
      session_policy: new_session
      commentsVar: review_comments
      onExhaustion: exhausted

  - id: approval
    type: human
    input:
      requires:
        - { artifact: impl-diff, kind: diff }
        - { artifact: verification, kind: test_report }
    pre_finish:
      gates:
        - id: behavior-evidence
          kind: artifact_required
          mode: blocking
          inputArtifacts: [behavior-baseline, verification]
    finish:
      human:
        role: maintainer
        decisions: [approve, rework, takeover]
        commentsVar: review_comments
    transitions:
      approve: finalize
      rework: refactor
      takeover: verify
    rework:
      allowedTargets: [refactor]
      workspacePolicies: [keep, rewind-to-node-checkpoint]
      maxLoops: 3
      session_policy: new_session
      commentsVar: review_comments
      resetTargets: [verify]

  - id: finalize
    type: ai_coding
    session: finalize
    action:
      prompt: |
        Re-run the behavior baseline and relevant checks. Commit all requested
        tracked changes locally with a conventional `refactor:` commit. Do not
        push, merge, open a PR, switch branches, or remove the worktree; MAIster
        owns promotion. Stop with a clean tracked worktree.
    pre_finish:
      gates:
        - id: tree-clean
          kind: command_check
          mode: blocking
          command: 'test -z "$(git status --porcelain --untracked-files=no)"'
    transitions:
      success: done
