schemaVersion: 1
name: aif-dev-light
metadata:
  title: "AIF — Develop (light)"
  summary: "aif-dev without the /aif-improve pass: intake → plan (emits the typed Plan-review pair itself) → plan_review → implement → bounded autonomous checks→code_review→fix loop → human review → commit."
  labels: [feature, enhancement, refactor, light]
  route_when: "A small/clear feature or refactor where a single planning pass is enough and the /aif-improve refinement step would add cost without value."
  links:
    - { kind: framework, title: "AI Factory 2.x", url: "https://github.com/lee-to/ai-factory/tree/2.x" }
    - { kind: docs, title: "Dev Workflow", url: "https://github.com/lee-to/ai-factory/blob/2.x/docs/workflow.md" }
  sources:
    - { component: "skills/aif-*, agents/*", origin: "github.com/lee-to/ai-factory@2.x" }
runner_profiles:
  claude-code:
    capability_agent: claude
    adapter: claude
    model: claude-opus-4-8
    provider:
      kind: anthropic
# Same floor rationale as aif-dev: typed Plan-review artifacts and the
# declarative `settings.plan_review` capability (ADR-137) → engine_min >= 3.1.0
# (covers sessions 2.0.0, rework onExhaustion/resetTargets 2.1.0, decide 1.7.0).
compat:
  engine_min: 3.1.0
# M30 (ADR-081): rework re-entry resumes the prior ACP session by default; the
# review→fix loop below overrides with `session_policy: new_session`.
defaults:
  session_policy: resume
# M42 (ADR-114): fresh-context phases at meaningful boundaries — implement /
# verify / fix / commit — each inheriting the flow's one claude-code runner.
# Planning stays on the implicit `default` session.
sessions:
  implement: { runner: claude-code }
  verify: { runner: claude-code }
  fix: { runner: claude-code }
  commit: { runner: claude-code }
# Flow-level calibration default, folded into the advisory ai_judgment gate at compile.
verdict_calibration:
  confidence_min: 0.7
nodes:
  # Preferences intake — MAIster-native HITL form (AskUserQuestion is disabled in
  # the adapter; the skills run non-interactively against these answers).
  - id: intake
    type: form
    settings:
      form_schema: ./schemas/intake.json
    transitions:
      success: plan

  # The light variant's one planning pass: /aif-plan plans AND emits the typed
  # Plan-review pair that aif-dev's separate /aif-improve node produces.
  - id: plan
    type: ai_coding
    # M30 (ADR-080): auto-retry infra failures only; the workspace rewinds to
    # the pre-attempt checkpoint. Same policy on every ai_coding node below.
    retry_policy:
      attempts: 2
      on_errors: [SPAWN, EXECUTOR_UNAVAILABLE, CHECKPOINT, ACP_PROTOCOL]
      workspace: rewind-to-node-checkpoint
    action:
      # `plan` is the plan_review rework target. On the initial visit
      # plan_review_comments is empty (runner-seeded); on a rework jump it
      # carries the reviewer's feedback so the re-plan addresses exactly what
      # was rejected.
      prompt: |
        @skill:aif-plan {{ task.prompt }}

        Non-interactive run — apply these preferences and do NOT ask:
        Testing={{ steps.intake.vars.tests }}, Logging={{ steps.intake.vars.logging }}, Docs={{ steps.intake.vars.docs }}.

        {{ plan_review_comments }}

        Typed Plan-review answers from a prior decision cycle (empty on first pass):
        {{ plan_review_answers }}

        This flow has no separate improve pass, so finish the planning pass by
        emitting the review pair yourself:
        Write the final Markdown implementation plan to $MAISTER_PLAN_DOCUMENT_FILE.
        Write its strict PlanReviewV1 JSON companion to $MAISTER_PLAN_REVIEW_FILE.
        Classify non-blocking assumptions separately from blocking decisions. Every
        decision must offer 2-8 concrete options with stable ids and consequences;
        never infer choices from prose or copy secret values into either artifact.
    output:
      produces:
        - id: plan-document
          kind: plan
          current: true
        - id: plan-review
          kind: plan
          current: true
    transitions:
      success: plan_review

  - id: plan_review
    type: human
    settings:
      plan_review:
        plan_document_artifact: plan-document
        plan_review_artifact: plan-review
        comments_var: plan_review_comments
        answers_var: plan_review_answers
        rework_transition: rework
        max_decision_reworks: 2
    finish:
      human:
        role: maintainer
        decisions: [approve, rework]
        commentsVar: plan_review_comments
    transitions:
      approve: implement
      rework: plan
    rework:
      allowedTargets: [plan]
      workspacePolicies: [keep]
      maxLoops: 3
      commentsVar: plan_review_comments

  - id: implement
    type: ai_coding
    # M42: fresh context — the approved plan is read from disk, not session memory.
    session: implement
    retry_policy:
      attempts: 2
      on_errors: [SPAWN, EXECUTOR_UNAVAILABLE, CHECKPOINT, ACP_PROTOCOL]
      workspace: rewind-to-node-checkpoint
    action:
      prompt: |
        @skill:aif-implement

        Non-interactive run — do NOT ask the user clarifying questions; proceed autonomously (tool-use permission prompts are handled by the platform).
    output:
      produces:
        - id: impl-diff
          kind: diff
          requiredFor: [review, merge]
    transitions:
      success: checks

  # Stack-agnostic verification (no hardcoded pnpm) — emits the gate result artifact.
  - id: checks
    type: ai_coding
    # M42: fresh verification context (the diff is read from disk).
    session: verify
    retry_policy:
      attempts: 2
      on_errors: [SPAWN, EXECUTOR_UNAVAILABLE, CHECKPOINT, ACP_PROTOCOL]
      workspace: rewind-to-node-checkpoint
    action:
      prompt: |
        @skill:aif-verify

        Non-interactive run — do NOT ask the user clarifying questions; proceed autonomously.
    input:
      requires:
        - artifact: impl-diff
          kind: diff
    output:
      produces:
        - id: aif-gate-result
          kind: test_report
    transitions:
      success: code_review

  - id: code_review
    type: judge
    # M42: shares the verify session — reviews the same diff checks just gated.
    session: verify
    retry_policy:
      attempts: 2
      on_errors: [SPAWN, EXECUTOR_UNAVAILABLE, CHECKPOINT, ACP_PROTOCOL]
      workspace: rewind-to-node-checkpoint
    action:
      prompt: |
        @skill:aif-review

        Non-interactive run — do NOT ask the user clarifying questions; proceed autonomously.

        End your response with a single `maister:output` block per the aif-review
        skill's "Native flow routing output" section: recommend "fix" when there is
        any CRITICAL finding (the loop then fixes and re-verifies), or "commit" when
        there are none (non-critical suggestions ride along in review_comments and do
        NOT block). Put the concrete items the next fix must address in review_comments.
    input:
      requires:
        - artifact: impl-diff
          kind: diff
    # ADR-103 (M38): route on the judge's own structured output.
    output:
      result:
        schema: ./schemas/review-outcome.json
        required: true
    decide:
      from: output.recommendation
    transitions:
      fix: fix
      commit: review
      exhausted: review
    # ADR-118: the autonomous bounded review↔fix loop. On exhaustion the loop
    # routes to the human `review` (onExhaustion) so the accumulated worktree is
    # preserved.
    rework:
      allowedTargets: [fix]
      workspacePolicies: [keep]
      maxLoops: 5
      session_policy: new_session
      commentsVar: review_comments
      onExhaustion: exhausted

  - id: review
    type: human
    pre_finish:
      gates:
        - id: impl-diff-required
          kind: artifact_required
          mode: blocking
          inputArtifacts: [impl-diff]
        - id: ai-quality-advisory
          kind: ai_judgment
          mode: advisory
          prompt: >
            Assess the implementation diff against the task requirements.
            Reply with a JSON object:
            {"verdict":"pass"|"fail","confidence":0-1,"reasons":[...]}
    finish:
      human:
        role: maintainer
        decisions: [approve, rework, takeover]
        commentsVar: review_comments
    transitions:
      approve: commit
      rework: fix
      # Takeover returns at `checks` (NOT `commit`) so the human's local edits
      # are re-validated through /aif-verify + /aif-review before commit.
      takeover: checks
    rework:
      allowedTargets: [fix]
      # M30 (ADR-079): the reviewer picks — keep the tree as rejected, or
      # rewind to the pre-fix checkpoint for a clean re-attempt.
      workspacePolicies: [keep, rewind-to-node-checkpoint]
      maxLoops: 3
      commentsVar: review_comments
      # M42: each rework iteration re-enters `fix` on a fresh session.
      session_policy: new_session
      # ADR-118: a human rework re-baselines the code_review loop's attempt
      # counter → a fresh maxLoops budget.
      resetTargets: [code_review]

  - id: fix
    type: ai_coding
    # M42: fresh rework context, focused on {{ review_comments }}.
    session: fix
    retry_policy:
      attempts: 2
      on_errors: [SPAWN, EXECUTOR_UNAVAILABLE, CHECKPOINT, ACP_PROTOCOL]
      workspace: rewind-to-node-checkpoint
    action:
      prompt: |
        @skill:aif-fix {{ review_comments }}

        Non-interactive run — do NOT ask the user clarifying questions; proceed autonomously (tool-use permission prompts are handled by the platform).
    transitions:
      success: checks

  - id: commit
    type: ai_coding
    # M42: clean commit context — only the working tree matters here.
    session: commit
    retry_policy:
      attempts: 2
      on_errors: [SPAWN, EXECUTOR_UNAVAILABLE, CHECKPOINT, ACP_PROTOCOL]
      workspace: rewind-to-node-checkpoint
    action:
      prompt: |
        @skill:aif-commit

        Non-interactive run — do NOT ask the user clarifying questions (e.g. do not prompt to push); commit only.
    pre_finish:
      gates:
        - id: commit-gate
          kind: command_check
          mode: blocking
          command: "test -z \"$(git status --porcelain --untracked-files=no)\" && git log -1 --pretty=%s | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\\([^)]+\\))?!?: .+'"
    transitions:
      success: done
