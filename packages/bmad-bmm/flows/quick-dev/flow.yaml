schemaVersion: 1
name: bmm-quick-dev
metadata:
  title: "BMAD — Quick Dev (compatibility)"
  summary: "Compatibility entry point for existing users. Routes a small change through the current bmad-build workflow, then a human approve, rework, or takeover gate. Prefer bmm-build for new automation."
  labels: [implementation, quick, dev, bmad]
  route_when: "Implement a small, well-scoped change end-to-end without the full story workflow."
  links:
    - { kind: framework, title: "BMAD Method", url: "https://github.com/bmad-code-org/BMAD-METHOD" }
  sources:
    - { component: "capability/skills/bmad-build + bmad-quick-dev compatibility shim", origin: "github.com/bmad-code-org/BMAD-METHOD@v6.11.0" }
runner_profiles:
  claude-code:
    capability_agent: claude
    adapter: claude
    model: claude-opus-4-8
    provider:
      kind: anthropic
# Pinned to the M42 2.0.0 engine baseline for this package release (single
# reused default session; no sessions: map needed).
compat:
  engine_min: 2.0.0
defaults:
  session_policy: resume
requirements:
  - name: "uv with Python 3.11+"
    probe: "command -v uv"
    hint: "install uv and ensure Python 3.11 or newer is available"
verdict_calibration:
  confidence_min: 0.7
nodes:
  - id: substrate
    type: cli
    action:
      command: '.claude/skills/bmad-runtime-support/prepare.sh "{{ run.projectSlug }}"'
    transitions:
      success: quick

  - id: quick
    type: ai_coding
    settings:
      agent: bmad-bmm:amelia-dev
      permissionMode: allow
    retry_policy:
      attempts: 2
      on_errors: [SPAWN, EXECUTOR_UNAVAILABLE, CHECKPOINT, ACP_PROTOCOL]
      workspace: rewind-to-node-checkpoint
    action:
      prompt: |
        [MAIster x BMAD — execution contract]
        You run NON-INTERACTIVELY inside MAIster, in an isolated git worktree on the correct branch. AskUserQuestion is DISABLED — never ask the user; make best-judgment decisions; corrections arrive via the HITL review gate. MAIster owns git + promotion: commit locally only; do NOT create worktrees/branches, merge, push, or open PRs. Inside any BMad skill, IGNORE the "On Activation / greet / present menu / STOP and wait for input" steps — execute the skill's <workflow> body directly. Load config from _bmad/bmm/config.yaml.

        THIS NODE — Quick end-to-end change:
        - Task: {{ task.prompt }}
        - Drive the current `bmad-build` skill on its headless path: clarify intent from the task, plan minimally, implement test-first, run the project's real verification, and self-review. No placeholders. Do not invoke the deprecated `bmad-quick-dev` shim.
        - Commit locally with conventional messages. STOP when implemented + committed — the next node reviews the diff.

        Reviewer feedback from a prior review (empty on first pass):
        {{ review_comments }}
    output:
      produces:
        - id: impl-diff
          kind: diff
          requiredFor: [review, merge]
    transitions:
      success: review

  - id: review
    type: human
    input:
      requires:
        - artifact: impl-diff
          kind: diff
    pre_finish:
      gates:
        - id: impl-diff-required
          kind: artifact_required
          mode: blocking
          inputArtifacts: [impl-diff]
        - id: review-quality-advisory
          kind: ai_judgment
          mode: advisory
          prompt: >
            Assess the implementation diff against the task intent. Reply with a
            JSON object:
            {"verdict":"pass"|"fail","confidence":0-1,"reasons":[...]}
    finish:
      human:
        role: maintainer
        decisions: [approve, rework, takeover]
        commentsVar: review_comments
    transitions:
      approve: done
      rework: quick
      takeover: done
    rework:
      allowedTargets: [quick]
      workspacePolicies: [keep, rewind-to-node-checkpoint]
      maxLoops: 3
      commentsVar: review_comments
