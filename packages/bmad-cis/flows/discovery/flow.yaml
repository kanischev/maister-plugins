schemaVersion: 1
name: cis-discovery
metadata:
  title: "CIS — Governed discovery"
  summary: "RAH fan-out over four read-only CIS personas -> collected synthesis -> one writer produces the discovery brief -> human approve, rework, or defer."
  labels: [discovery, ideation, creative, rah, cis, bmad]
  route_when: "Explore a fuzzy problem or opportunity before planning, with independent creative lenses and a governed human handoff."
  links:
    - { kind: framework, title: "BMAD Creative Intelligence Suite", url: "https://github.com/bmad-code-org/bmad-module-creative-intelligence-suite" }
  sources:
    - { component: "capability/skills/bmad-cis-* + maister-agents/*", origin: "github.com/bmad-code-org/bmad-module-creative-intelligence-suite@v0.3.2" }
compat:
  engine_min: 3.7.0
runner_profiles:
  claude-code:
    capability_agent: claude
    adapter: claude
    model: claude-opus-4-8
    provider:
      kind: anthropic
defaults:
  session_policy: resume
sessions:
  orchestrate: { runner: claude-code }
  synthesize: { runner: claude-code }
result:
  export:
    schema: ./schemas/public-result.v1.json
    from: [synthesize, deferred]
    required: true
nodes:
  - id: substrate
    type: cli
    action:
      command: '.claude/skills/bmad-runtime-support/prepare.sh "{{ run.projectSlug }}"'
    transitions:
      success: orchestrate

  - id: orchestrate
    type: orchestrator
    session: orchestrate
    action:
      prompt: |
        You coordinate a governed, read-only creative discovery for:
        {{ task.prompt }}

        Human guidance from a prior escalation or final review, when present:
        {{ review_comments }}

        Use `run_plan` to launch exactly four independent AGENT children with
        `mode: "run"`, `workspace: "repo_read"`, and
        `resultProfile: "creative-contribution"`:
        - `bmad-cis:quinn-problem-solver`: root causes, system constraints, and the sharp problem frame.
        - `bmad-cis:maya-design-thinking`: users, unmet needs, and human-centered concepts.
        - `bmad-cis:carson-brainstorming`: deliberately divergent options and constraint-breaking ideas.
        - `bmad-cis:victor-innovation`: strategic value, differentiation, and business-model implications.

        Each child prompt must forbid repository writes and require its final
        answer to end with exactly one result block shaped as:

        ```json maister:output
        {"summary":"...","outcome":"completed","payload":{}}
        ```

        Wait for all children, collect every terminal result with `run_collect`,
        and synthesize only evidence you actually consumed. If a child fails,
        retry it once when budget permits; otherwise explain the missing lens.
        End your own final answer with exactly one block shaped as:

        ```json maister:output
        {"summary":"...","outcome":"success","consumedChildRunIds":["..."],"payload":{"problemFrame":{},"userNeeds":[],"concepts":[],"strategicAssessment":{},"risks":[],"recommendation":{}}}
        ```

        If no defensible recommendation can be made, use `"outcome":"blocked"`
        and put the unresolved decisions in `payload`.
    settings:
      enforcement:
        tools: strict
      tools:
        claude: [Read, Grep, Glob]
        codex: [shell]
      delegation:
        max_depth: 1
        max_fanout: 4
        max_active_children: 4
        budget:
          max_tokens: 600000
          wall_clock_minutes: 90
          max_child_runs: 8
          consecutive_failures: 2
    output:
      result:
        schema: ./schemas/discovery-synthesis.v1.json
        required: true
        on_mismatch: retry
    decide:
      from: output.outcome
    rework:
      allowedTargets: [orchestrate]
      workspacePolicies: [keep]
      maxLoops: 2
      commentsVar: review_comments
    transitions:
      success: synthesize
      blocked: escalation
      retry: orchestrate

  - id: escalation
    type: human
    finish:
      human:
        role: product-owner
        decisions: [continue, rework, defer]
        commentsVar: review_comments
    transitions:
      continue: synthesize
      rework: orchestrate
      defer: deferred
    rework:
      allowedTargets: [orchestrate]
      workspacePolicies: [keep]
      maxLoops: 2
      commentsVar: review_comments

  - id: synthesize
    type: ai_coding
    session: synthesize
    settings:
      agent: bmad-cis:victor-innovation
      permissionMode: allow
    retry_policy:
      attempts: 2
      on_errors: [SPAWN, EXECUTOR_UNAVAILABLE, CHECKPOINT, ACP_PROTOCOL]
      workspace: rewind-to-node-checkpoint
    action:
      prompt: |
        [MAIster x BMAD CIS — writer contract]
        You are the only writer in this discovery tree. MAIster owns git and
        promotion: do not create branches/worktrees, merge, push, or open a PR.

        Task: {{ task.prompt }}
        Collected synthesis: {{ steps.orchestrate.vars.payload }}
        Human guidance, when present: {{ review_comments }}

        Check the synthesis against the repository, resolve contradictions, and
        write `docs/planning-artifacts/discovery-brief.md` with the problem,
        target users, strongest concepts, value thesis, evidence, risks,
        assumptions, and recommended next step. Commit the brief locally.

        End with exactly one machine result block:
        ```json maister:output
        {"summary":"...","outcome":"completed","payload":{"artifact":"docs/planning-artifacts/discovery-brief.md","sourceRunIds":[],"recommendation":{}}}
        ```
        Populate `sourceRunIds` from
        {{ steps.orchestrate.vars.consumedChildRunIds }}.
    pre_finish:
      gates:
        - id: brief-written
          kind: command_check
          mode: blocking
          command: "test -s docs/planning-artifacts/discovery-brief.md"
    output:
      produces:
        - id: discovery-brief
          kind: generic_file
      result:
        schema: ./schemas/public-result.v1.json
        required: true
        on_mismatch: retry
    rework:
      allowedTargets: [synthesize]
      workspacePolicies: [keep, rewind-to-node-checkpoint]
      maxLoops: 2
      commentsVar: review_comments
    transitions:
      success: review
      retry: synthesize

  - id: review
    type: human
    input:
      requires:
        - artifact: discovery-brief
          kind: generic_file
    finish:
      human:
        role: product-owner
        decisions: [approve, rework, defer]
        commentsVar: review_comments
    transitions:
      approve: done
      rework: orchestrate
      defer: deferred
    rework:
      allowedTargets: [orchestrate]
      workspacePolicies: [keep, rewind-to-node-checkpoint]
      maxLoops: 3
      commentsVar: review_comments

  - id: deferred
    type: ai_coding
    action:
      prompt: |
        Do not modify the repository. Summarize why discovery was deferred and
        what decision or evidence is needed to resume.
        Human comments or structured-output correction: {{ review_comments }}
        End with exactly:
        ```json maister:output
        {"summary":"Discovery deferred by the human gate.","outcome":"needs_input","payload":{"resumeRequirements":[]}}
        ```
    output:
      result:
        schema: ./schemas/public-result.v1.json
        required: true
        on_mismatch: retry
    rework:
      allowedTargets: [deferred]
      workspacePolicies: [keep]
      maxLoops: 1
      commentsVar: review_comments
    transitions:
      success: done
      retry: deferred
