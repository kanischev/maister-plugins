# MAIster package manifest. Contract: docs/pv/package-management.md (MAIster
# repo) — flows[].id MUST equal each flow.yaml `name`; paths are
# package-root-relative; the version pin is the git tag (bmad-cis/vX.Y.Z), never
# a field in this file.
#
# NOTE: the upstream BMAD Creative Intelligence Suite version this package
# vendors (v0.3.2) is recorded in metadata.sources and the README — independent
# of this package's own git tag.
schemaVersion: 1
name: bmad-cis
metadata:
  title: "BMAD Method — Creative Intelligence Suite (CIS)"
  summary: "BMAD Creative Intelligence Suite v0.3.2 as six MAIster platform agents plus a governed RAH discovery flow that fans out read-only creative perspectives, synthesizes them, and hands a reviewed brief to bmm-plan."
  links:
    - { kind: framework, title: "BMAD Creative Intelligence Suite", url: "https://github.com/bmad-code-org/bmad-module-creative-intelligence-suite" }
  sources:
    - { component: "capability/skills/bmad-cis-{design-thinking,innovation-strategy,problem-solving,storytelling} + maister-agents/*", origin: "github.com/bmad-code-org/bmad-module-creative-intelligence-suite@v0.3.2 (97298b22fee1c7e482710d3a8414adb5cfccccd9)" }
    - { component: "capability/skills/bmad-runtime-support + capability/reference/LICENSE.bmad", origin: "BMAD v6.11.0 resolver scripts + BMAD CIS v0.3.2 MIT license" }
flows:
  - { id: cis-discovery, path: flows/discovery }
# capability/skills is materialized into `.claude/skills/`; reference/ is
# provenance-only. The six personas are indexed from maister-agents/.
capabilities:
  - { id: cis-bundle, path: capability }
mcps: []
result_profiles:
  creative-contribution:
    schema: ./schemas/creative-contribution.v1.json
